apiVersion: alerting.grafana.crossplane.io/v1alpha1
kind: RuleGroup
metadata:
  name: example-service-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forProvider:
    name: "Example Service Monitor"
    folderUid: "bds4wss5qivwgc"
    orgId: "1"
    intervalSeconds: 60
    rule:
      - name: "Service not reachable"
        condition: "A"
        for: "5m"
        annotations:
          summary: "{{$labels.cluster}}/{{$labels.kubernetes_namespace}}/{{$labels.k8s_app}} Service not reachable"
          description: "Service {{$labels.service}} is not reachable"
        data:
          - refId: "A"
            relativeTimeRange:
              - from: 300
                to: 0
            datasourceUid: "prometheus"
            model: |
              {
                "expr": "min(probe_success{job=\"prometheus.scrape.healthchecks\",service=~\"radarr|sonarr|plex\"}) by(service, kubernetes_namespace, k8s_app, cluster) < 1",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
  providerConfigRef:
    name: default
