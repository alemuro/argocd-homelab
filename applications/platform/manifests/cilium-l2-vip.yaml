apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-vip-pool
spec:
  cidrs:
    - cidr: "192.168.1.200/32"
  serviceSelector:
    matchLabels:
      io.cilium/l2-announce: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-l2-policy
spec:
  serviceSelector:
    matchLabels:
      io.cilium/l2-announce: "true"
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eth0$
  externalIPs: false
  loadBalancerIPs: true
