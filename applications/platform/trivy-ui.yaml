apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-ui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://github.com/locustbaby/trivy-ui.git
      targetRevision: v0.0.5
      path: charts/trivy-ui
      helm:
        releaseName: trivy-ui
        values: |
          clusterSources:
            incluster:
              type: inCluster

          kubeconfigs:
            enabled: false

          rbac:
            create: true

          serviceAccount:
            create: true

          ingress:
            enabled: true
            className: "traefik"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              traefik.ingress.kubernetes.io/router.tls.certresolver: default
            hosts:
              - host: trivy.immaleix.casa
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: trivy-ui-tls
                hosts:
                  - trivy.immaleix.casa

          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          cache:
            enabled: true
            sizeLimit: "256Mi"

  destination:
    name: homelab
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
