name: radarr
image: lscr.io/linuxserver/radarr
tag: 6.4.4
port: 7878
node_selector:
  kubernetes.io/hostname: worker-0
domains:
  - radarr.immaleix.casa
mount:
  /mnt/local/configs/radarr: /config
  /mnt/nfs/homeflix-v2: /media
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
probes:
  startup:
    exec:
      command:
        - test
        - -f
        - /media/.mounted
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    exec:
      command:
        - test
        - -f
        - /media/.mounted
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
allow_from:
  - prowlarr
  - seerr
  - bazarr
  - maintainerr
  - radarr-exporter
  - sizeondisk-exporter
  - discovarr
  - oracularr
