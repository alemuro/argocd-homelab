name: sonarr
image: lscr.io/linuxserver/sonarr
tag: 4.0.20
port: 8989
node_selector:
  kubernetes.io/hostname: worker-0
domains:
  - sonarr.immaleix.casa
mount:
  /mnt/local/configs/sonarr: /config
  /mnt/nfs/homeflix-v2: /media
  /mnt/gdrive/tv: /media/gdrive-tv
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
probes:
  startup:
    exec:
      command:
        - test
        - -f
        - /media/.mounted
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    exec:
      command:
        - test
        - -f
        - /media/.mounted
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
allow_from:
  - prowlarr
  - seerr
  - bazarr
  - maintainerr
  - sonarr-exporter
  - sizeondisk-exporter
  - discovarr
  - oracularr
