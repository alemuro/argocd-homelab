name: qbittorrent
image: lscr.io/linuxserver/qbittorrent
tag: 20.04.1
port: 8080
node_selector:
  kubernetes.io/hostname: worker-0
domains:
  - qbittorrent.immaleix.casa
  - torrents.immaleix.casa
pod_additional_ports:
  - name: torrent
    container_port: 6881
    host_port: 6881
    protocol: TCP
  - name: torrent-udp
    container_port: 6881
    host_port: 6881
    protocol: UDP
mount:
  /mnt/local/configs/qbittorrent/config: /config
  /mnt/nfs/homeflix-v2/downloads: /downloads
env:
  WEBUI_PORT: "8080"
  TORRENTING_PORT: "6881"
probes:
  startup:
    exec:
      command:
        - test
        - -f
        - /downloads/.mounted
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    exec:
      command:
        - test
        - -f
        - /downloads/.mounted
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
allow_from:
  - radarr
  - sonarr
  - readarr
  - qbittorrent-exporter
  - qbit-voter
allow_from_cidrs:
  - 0.0.0.0/0
