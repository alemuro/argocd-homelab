name: bazarr
image: lscr.io/linuxserver/bazarr
tag: 1.6.0
port: 6767
node_selector:
  kubernetes.io/hostname: worker-0
domains:
  - bazarr.immaleix.casa
mount:
  /mnt/local/configs/bazarr/config: /config
  /mnt/nfs/homeflix-v2: /media
  /mnt/gdrive/tv: /media/gdrive-tv
env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Madrid"
