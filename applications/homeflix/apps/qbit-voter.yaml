name: qbit-voter
image: ghcr.io/gerardag/qbit-voter
tag: v0.7.2
port: 3000
# node_selector:
  # kubernetes.io/hostname: worker-0
domains:
  - qbit-voter.immaleix.casa
serviceAnnotations:
  k8s.grafana.com/scrape: "true"
  k8s.grafana.com/metrics.portName: "http"
  k8s.grafana.com/metrics.scheme: "http"
  k8s.grafana.com/metrics.path: "/metrics"
  k8s.grafana.com/metrics.scrapeInterval: "5m"
# mount:
  # /mnt/local/configs/qbit-voter: /app/data
env:
  QBIT_URL: http://qbittorrent:80
  PORT: "3000"
  # CONFIG_PATH: /app/data/config.json
  VOTED_TAG: "liked"
  QBIT_USER: admin
  QBIT_PASS: adminadmin
