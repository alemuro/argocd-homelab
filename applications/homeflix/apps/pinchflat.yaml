name: pinchflat
image: ghcr.io/kieraneglin/pinchflat
tag: v2025.6.6
port: 8945
node_selector:
  kubernetes.io/hostname: worker-0
domains:
  - pinchflat.immaleix.casa
mount:
  /mnt/local/configs/pinchflat: /config
  /mnt/nfs/homeflix-v2/pinchflat-media: /downloads
env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Madrid"
probes:
  startup:
    exec:
      command:
        - test
        - -f
        - /downloads/.mounted
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    exec:
      command:
        - test
        - -f
        - /downloads/.mounted
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
