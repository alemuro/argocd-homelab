name: farewell
image: ghcr.io/alemuro/homeflix-farewell
tag: v0.3.1
port: 3000
node_selector:
  kubernetes.io/hostname: worker-0
imagePullSecrets:
  - name: github-credentials
image_updater:
  enabled: true
  strategy: semver
  allow_tags: "v*"
domains:
  - farewell.immaleix.casa
env:
  MAINTAINTERR_URL: http://maintainerr:80
  PLEX_BASE_URL: https://plex.immaleix.casa
  PLEX_OAUTH_CLIENT_ID: homeflix-farewell
  AUTH: plex
  TZ: Europe/Madrid
secretEnv:
  SESSION_SECRET:
    secretName: farewell-session
    key: SESSION_SECRET
probes:
  liveness:
    httpGet:
      path: /health
      port: 3000
