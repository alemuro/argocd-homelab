name: "homeflix-monitors"
title: "Homeflix Monitors"
folderUid: "bds4wss5qivwgc"
intervalSeconds: 60

rules:
  - name: "Sonarr / Cannot import downloads"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "Sonarr / Cannot import downloads"
    description: |
      Runbook:
      1. Go to https://sonarr.immaleix.casa/activity/queue to inspect blocked downloads.
      2. Verify destination permissions or disk space.
      3. Import or remove blocked items manually.
    expr: 'max(sonarr_queue_total{download_state="importBlocked"} or vector(0))'

  - name: "qBittorrent down"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "below"
    threshold: 1
    summary: "qBittorrent service down"
    description: |
      Runbook:
      1. Check pod status with 'kubectl get pod -n homeflix -l app=qbittorrent'.
      2. Verify Web UI at https://qbittorrent.immaleix.casa.
      3. Inspect logs with 'kubectl logs -n homeflix -l app=qbittorrent'.
    expr: 'qbittorrent_up'

  - name: "qBittorrent disconnected from network"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "below"
    threshold: 1
    summary: "qBittorrent disconnected from BitTorrent network"
    description: |
      Runbook:
      1. Check VPN status with 'kubectl logs -n homeflix -l app=gluetun'.
      2. Verify P2P port forwarding / outbound connectivity.
      3. Restart gluetun or qbittorrent pod if VPN reconnection stalled.
    expr: 'qbittorrent_connected'

  - name: "qBittorrent torrents in error state"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "qBittorrent has torrents with errors or missing files"
    description: |
      Runbook:
      1. Access https://qbittorrent.immaleix.casa and filter torrents by 'Errored' or 'Missing Files'.
      2. Perform 'Force Recheck'.
      3. Check NFS mount status under /mnt/nfs/homeflix-v2/downloads.
    expr: 'sum(qbittorrent_torrents_count{status=~"error|missingFiles"})'

  - name: "qBittorrent too many torrents queued in upload"
    condition: "A"
    for: "15m"
    from: 900
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "qBittorrent too many torrents queued in upload"
    description: |
      Runbook:
      1. Access https://qbittorrent.immaleix.casa.
      2. Check Queueing limits under Options -> BitTorrent -> Queueing.
      3. Adjust max active uploads limit or force resume queued torrents if needed.
    expr: 'sum(qbittorrent_torrents_count{status="queuedUP"})'
