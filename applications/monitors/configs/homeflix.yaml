name: "homeflix-monitors"
title: "Homeflix Monitors"
folderUid: "bds4wss5qivwgc"
intervalSeconds: 60

rules:
  - name: "Sonarr / Cannot import downloads"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "Sonarr / Cannot import downloads"
    description: |
      [AUTONOMY: HUMAN-ONLY] (Agent provides context only)
      1. DIAGNOSIS: Query Sonarr API `GET /api/v3/queue` to inspect blocked downloads or check UI https://sonarr.immaleix.casa/activity/queue. Verify destination permissions on `/media/tv` and disk space.
      2. AGENT BOUNDARY: DO NOT force import or delete torrent/media files automatically.
      3. ACTION: Notify human with series name, release title, and failure reason (e.g. disk space, permissions, sample file, or mismatch).
      4. HUMAN RESOLUTION: Resolve blocking issue in Sonarr UI or import manually via Wanted -> Manual Import.
    expr: 'max(sonarr_queue_total{download_state="importBlocked"} or vector(0))'

  - name: "qBittorrent down"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "below"
    threshold: 1
    summary: "qBittorrent service down"
    description: |
      [AUTONOMY: AGENT-AUTO]
      1. DIAGNOSIS: Run `kubectl get pod -n homeflix -l app=qbittorrent` and check logs `kubectl logs -n homeflix -l app=qbittorrent --tail=50`. Verify UI at https://qbittorrent.immaleix.casa.
      2. REMEDIATION: If pod is CrashLooping, hanging or probe failing, execute `kubectl rollout restart deployment/qbittorrent -n homeflix`.
      3. ESCALATION: If qBittorrent remains down 5m after restart or persistent storage fails, alert human.
    expr: 'qbittorrent_up'

  - name: "qBittorrent disconnected from network"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "below"
    threshold: 1
    summary: "qBittorrent disconnected from BitTorrent network"
    description: |
      [AUTONOMY: AGENT-AUTO]
      1. DIAGNOSIS: Check gluetun VPN logs `kubectl logs -n homeflix -l app=gluetun --tail=50` and verify outbound connectivity / port forwarding.
      2. REMEDIATION: Restart gluetun or qbittorrent pod (`kubectl rollout restart deployment/gluetun -n homeflix` or `kubectl rollout restart deployment/qbittorrent -n homeflix`).
      3. ESCALATION: If VPN tunnel reconnection fails repeatedly or credentials have expired, notify human.
    expr: 'qbittorrent_connected'

  - name: "qBittorrent torrents in error state"
    condition: "A"
    for: "5m"
    from: 300
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "qBittorrent has torrents with errors or missing files"
    description: |
      [AUTONOMY: AGENT-SUPERVISED]
      1. DIAGNOSIS: Access qBittorrent API/UI at https://qbittorrent.immaleix.casa, filter torrents by 'Errored' or 'Missing Files', and verify NFS mount under `/mnt/nfs/homeflix-v2/downloads`.
      2. REMEDIATION: Trigger 'Force Recheck' via qBittorrent API on affected torrents.
      3. ESCALATION: If files are permanently missing or recheck fails, DO NOT delete files; notify human with the list of affected torrents.
    expr: 'sum(qbittorrent_torrents_count{status=~"error|missingFiles"})'

  - name: "qBittorrent too many torrents queued in upload"
    condition: "A"
    for: "15m"
    from: 900
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 0
    summary: "qBittorrent too many torrents queued in upload"
    description: |
      [AUTONOMY: AGENT-SUPERVISED]
      1. DIAGNOSIS: Check queue limits in qBittorrent (Options -> BitTorrent -> Queueing) and verify current upload/seeding torrent counts.
      2. REMEDIATION: Force resume queued torrents if upload bandwidth is available, or verify Maintainerr/qbit-voter cleanup jobs.
      3. ESCALATION: If queue congestion persists or upload limits need permanent tuning, request human review.
    expr: 'sum(qbittorrent_torrents_count{status="queuedUP"})'

  - name: "qbit-voter too many pending validations"
    condition: "A"
    for: "15m"
    from: 900
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "above"
    threshold: 20
    summary: "qbit-voter has too many torrents pending validation"
    description: |
      [AUTONOMY: HUMAN-ONLY] (Agent checks health only)
      1. DIAGNOSIS: Check qbit-voter pod status (`kubectl get pods -n homeflix -l app=qbit-voter`) and API connectivity to qBittorrent.
      2. AGENT BOUNDARY: DO NOT auto-vote or auto-delete pending torrents.
      3. ACTION: Check https://qbit-voter.immaleix.casa and notify human to review and vote on pending torrents.
    expr: 'qbit_voter_untagged_torrents'
