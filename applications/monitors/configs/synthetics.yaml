name: "synthetics-monitors"
title: "Synthetics Monitors"
folderUid: "bds4wss5qivwgc"
intervalSeconds: 60

rules:
  - name: "Synthetic test failed"
    condition: "A"
    for: "15m"
    from: 900
    to: 0
    datasourceUid: "grafanacloud-prom"
    operator: "below"
    threshold: 1
    summary: "Synthetic test {{$labels.instance}} failed"
    description: |
      [AUTONOMY: AGENT-SUPERVISED]
      1. DIAGNOSIS:
         - Check reachability and HTTP response code for {{$labels.instance}}.
         - Verify Cloudflare Tunnel pod status: `kubectl get pods -n ingress`.
         - Test local vs public DNS resolution for the endpoint.
      2. REMEDIATION:
         - If Cloudflare Tunnel pod is stalled or disconnected, restart it: `kubectl rollout restart deployment -n ingress`.
      3. ESCALATION:
         - If failure is caused by upstream ISP outage, external domain registration, or Cloudflare edge issue, notify human.
    expr: 'max(probe_success{job!~"prometheus.*"}) by(instance)'
