name: nubulus-tunnel-murtra
image: code.as210469.net/nubulusnetworkopensource/tunnel
tag: v3.0.0
port: 9990
servicePort: 9990
serviceAnnotations:
  k8s.grafana.com/scrape: "true"
  k8s.grafana.com/metrics.portName: http
  k8s.grafana.com/metrics.path: /metrics
  k8s.grafana.com/metrics.scheme: http
  k8s.grafana.com/metrics.scrapeInterval: 5m
node_selector:
  kubernetes.io/arch: amd64
env:
  PUID: "1000"
  PGID: "1000"
  TZ: "Europe/Madrid"
  METRICS_LISTEN_ADDR: 0.0.0.0:9990
secretEnv:
  TUNNEL_TOKEN:
    secretName: nubulus-tunnel-murtra
    key: TUNNEL_TOKEN
