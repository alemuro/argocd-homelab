name: grampsweb
type: StatefulSet
image: ghcr.io/gramps-project/grampsweb
tag: 26.11.0
port: 5000
domains:
  - gramps.immaleix.casa
  - gramps.aleix.cloud
node_selector:
  kubernetes.io/hostname: worker-1
mount:
  /mnt/local/configs/gramps/users: /app/users
  /mnt/local/configs/gramps/indexdir: /app/indexdir
  /mnt/local/configs/gramps/thumbnail: /app/thumbnail_cache
  /mnt/local/configs/gramps/cache: /app/cache
  /mnt/local/configs/gramps/secret: /app/secret
  /mnt/local/configs/gramps/grampdb: /root/.gramps/grampsdb
  /mnt/local/configs/gramps/media: /app/media
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi
env:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Madrid
  GRAMPSWEB_TREE: "Roger Murtra"
  GRAMPSWEB_REGISTRATION_DISABLED: "True"
  GUNICORN_NUM_WORKERS: "2"
  GRAMPSWEB_OIDC_ENABLED: "True"
  GRAMPSWEB_BASE_URL: "https://gramps.aleix.cloud"
  GRAMPSWEB_OIDC_GOOGLE_CLIENT_ID: "954824716156-vaobidkpld8re2ovgfdamfu9dqfu37rf.apps.googleusercontent.com"
  GRAMPSWEB_EMAIL_HOST: "email-smtp.eu-west-1.amazonaws.com"
  GRAMPSWEB_EMAIL_PORT: "465"
  GRAMPSWEB_EMAIL_HOST_USER: "AKIAWGMO3DUU4M7JN7UZ"
  GRAMPSWEB_DEFAULT_FROM_EMAIL: "gramps@aleix.cloud"
secretEnv:
  GRAMPSWEB_OIDC_GOOGLE_CLIENT_SECRET:
    secretName: grampsweb-secrets
    key: GOOGLE_CLIENT_SECRET
  GRAMPSWEB_EMAIL_HOST_PASSWORD:
    secretName: grampsweb-secrets
    key: EMAIL_HOST_PASSWORD
