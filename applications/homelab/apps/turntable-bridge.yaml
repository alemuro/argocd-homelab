name: turntable-bridge
image: ghcr.io/alemuro/turntable-bridge
tag: 1.1.0
port: 8080
domains:
  - phonos.immaleix.casa
node_selector:
  kubernetes.io/hostname: summer
securityContext:
  privileged: true
mount:
  /var/run/dbus/system_bus_socket: /var/run/dbus/system_bus_socket
  /dev: /dev
pod_additional_ports:
  - name: stream
    container_port: 8000
    host_port: 8000
    protocol: TCP
  - name: web-host
    container_port: 8080
    host_port: 8080
    protocol: TCP
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
secretEnv:
  HASS_TOKEN:
    secretName: turntable-bridge-secrets
    key: HASS_TOKEN
env:
  PORT: "8080"
  TURNTABLE_MAC: "AD:60:17:9B:D5:AC"
  ICECAST_HOST: "192.168.1.14"
  HASS_URL: "https://local.immaleix.casa"
  SONOS_ENTITY_ID: "media_player.menjador_sonos_2"
  SONOS_STREAM_URL: "https://phonos.immaleix.casa/sonos.mp3"
allow_from_cidrs:
  - 192.168.1.0/24
allow_from_namespaces:
  - ingress
