name: glance
image: glanceapp/glance
tag: latest
port: 8080
domains:
  - glance.immaleix.casa
node_selector:
  kubernetes.io/hostname: worker-1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
env:
  TZ: Europe/Madrid
configmaps:
  /app/config/glance.yml: |
    theme:
      background-color: 232 23 18
      contrast-multiplier: 1.2
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73

    branding:
      app-name: "Homelab Glance"

    pages:
      - name: Home
        head-widgets:
          - type: search
            autofocus: false
            search-engine: google

        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Europe/Madrid
                    label: Barcelona
              - type: weather
                location: Barcelona, Spain
                units: metric
                hour-format: 24h

          - size: full
            widgets:
              - type: videos
                title: NetworkChuck
                channels:
                  - UC9x0AN7BWHpCDHSm9NiJFJQ
                limit: 6
                collapse-after: 3

              - type: group
                widgets:
                  - type: hacker-news
                    limit: 15
                    collapse-after: 5
                  - type: reddit
                    subreddit: homelab
                    show-thumbnails: true
                    limit: 15
                    collapse-after: 5
                  - type: reddit
                    subreddit: antigravity
                    show-thumbnails: true
                    limit: 15
                    collapse-after: 5

      - name: Apps
        columns:
          - size: full
            widgets:
              - type: monitor
                title: Media & Streaming
                cache: 1m
                sites:
                  - title: Plex
                    url: https://plex.immaleix.casa/web
                    check-url: https://plex.immaleix.casa/identity
                    icon: di:plex
                  - title: Seerr
                    url: https://seerr.immaleix.casa
                    icon: di:overseerr
                  - title: Sonarr
                    url: https://sonarr.immaleix.casa
                    icon: di:sonarr
                  - title: Radarr
                    url: https://radarr.immaleix.casa
                    icon: di:radarr
                  - title: Bazarr
                    url: https://bazarr.immaleix.casa
                    icon: di:bazarr
                  - title: Prowlarr
                    url: https://prowlarr.immaleix.casa
                    icon: di:prowlarr
                  - title: qBittorrent
                    url: https://qbittorrent.immaleix.casa
                    icon: di:qbittorrent
                  - title: Tautulli
                    url: https://tautulli.immaleix.casa
                    icon: di:tautulli
                  - title: Maintainerr
                    url: https://maintainerr.immaleix.casa
                    icon: di:maintainerr
                  - title: Pinchflat
                    url: https://pinchflat.immaleix.casa
                    icon: mdi:youtube
                  - title: Miniserve
                    url: https://miniserve.immaleix.casa
                    icon: mdi:server
                    alt-status-codes:
                      - 401
                  - title: Farewell
                    url: https://farewell.immaleix.casa
                    icon: mdi:delete-sweep
                  - title: qBit-Voter
                    url: https://qbit-voter.immaleix.casa
                    icon: mdi:vote
                  - title: Jackett
                    url: https://jackett.immaleix.casa
                    check-url: https://jackett.immaleix.casa/UI/Login
                    icon: di:jackett

              - type: monitor
                title: Serveis Homelab
                cache: 1m
                sites:
                  - title: Nextcloud
                    url: https://nextcloud.immaleix.casa
                    check-url: https://nextcloud.immaleix.casa/status.php
                    icon: di:nextcloud
                  - title: Vaultwarden
                    url: https://vaultwarden.immaleix.casa
                    icon: di:vaultwarden
                  - title: Pairdrop
                    url: https://airdrop.immaleix.casa
                    icon: sh:pairdrop
                  - title: n8n
                    url: https://n8n.immaleix.casa
                    icon: di:n8n
                  - title: Uptime Kuma
                    url: https://uptime.immaleix.casa
                    icon: di:uptime-kuma
                  - title: Umami
                    url: https://umami.immaleix.casa
                    icon: di:umami
                  - title: phpMyAdmin
                    url: https://phpmyadmin.immaleix.casa
                    icon: di:phpmyadmin

              - type: monitor
                title: DevOps & Infra
                cache: 1m
                sites:
                  - title: ArgoCD
                    url: https://argocd.immaleix.casa
                    icon: di:argo-cd
                  - title: Forgejo Git
                    url: https://git.immaleix.casa
                    icon: di:forgejo
                  - title: DNS 1 (AdGuard)
                    url: https://dns1.immaleix.casa
                    icon: di:adguard-home
                  - title: DNS 2 (AdGuard)
                    url: https://dns2.immaleix.casa
                    icon: di:adguard-home
                  - title: OpenBao
                    url: https://openbao.immaleix.casa
                    icon: di:openbao
                  - title: Consul
                    url: https://consul.immaleix.casa
                    icon: di:consul
