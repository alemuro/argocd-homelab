apiVersion: alerting.grafana.crossplane.io/v1alpha1
kind: RuleGroup
metadata:
  name: {{ default .Release.Name .Values.name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  forProvider:
    name: {{ default .Values.name .Values.title | quote }}
    folderUid: {{ .Values.folderUid | quote }}
    orgId: {{ default "1" .Values.orgId | quote }}
    intervalSeconds: {{ default 60 .Values.intervalSeconds }}
    rule:
      {{- range .Values.rules }}
      {{- $dsUid := default $.Values.prometheusDatasourceUid .datasourceUid }}
      {{- $dsType := "prometheus" }}
      {{- if eq $dsUid "grafanacloud-logs" }}
      {{- $dsType = "loki" }}
      {{- end }}
      {{- $opRaw := default "below" .operator }}
      {{- $op := "lt" }}
      {{- if or (eq $opRaw "above") (eq $opRaw "gt") (eq $opRaw ">") }}
      {{- $op = "gt" }}
      {{- end }}
      {{- $thresh := 1 }}
      {{- if hasKey . "threshold" }}
      {{- $thresh = .threshold }}
      {{- end }}
      - name: {{ .name | quote }}
        condition: "threshold"
        for: {{ default "5m" .for | quote }}
        annotations:
          summary: {{ .summary | quote }}
          description: {{ .description | quote }}
        data:
          - refId: "query"
            relativeTimeRange:
              - from: {{ default 600 .from }}
                to: {{ default 0 .to }}
            datasourceUid: {{ $dsUid | quote }}
            model: |
              {
                "editorMode": "code",
                "expr": {{ .expr | toJson }},
                "hide": false,
                "instant": true,
                "intervalMs": 1000,
                {{- if eq $dsType "prometheus" }}
                "legendFormat": "__auto",
                "range": false,
                {{- else }}
                "queryType": "instant",
                {{- end }}
                "maxDataPoints": 43200,
                "refId": "query"
              }
          - refId: "threshold"
            relativeTimeRange:
              - from: {{ default 600 .from }}
                to: {{ default 0 .to }}
            datasourceUid: "__expr__"
            model: |
              {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [{{ $thresh }}],
                      "type": {{ $op | quote }}
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": ["query"]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "query",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "threshold",
                "type": "threshold"
              }
      {{- end }}
  providerConfigRef:
    name: {{ default "default" .Values.providerConfigName | quote }}
